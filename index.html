<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กระดานเขียนอักษรแล้วสร้างเป็น GIF</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- gif.js library -->
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>

    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background-color: #f1f5f9;
        }
        /* ป้องกันการเลื่อนหน้าจอขณะวาดบนอุปกรณ์สัมผัส */
        #drawingCanvas {
            touch-action: none;
            cursor: crosshair;
        }
        .color-picker-wrapper {
            position: relative;
            overflow: hidden;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            border: 2px solid #e2e8f0;
        }
        .color-picker-wrapper input[type="color"] {
            position: absolute;
            right: -8px;
            top: -8px;
            width: 56px;
            height: 56px;
            cursor: pointer;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Message Box (แทน alert) -->
    <div id="messageBox" class="fixed top-4 right-4 p-4 rounded-xl shadow-lg transition-all duration-300 opacity-0 hidden z-50 transform translate-y-[-20px] max-w-sm flex items-center gap-3 font-medium">
        <span id="messageIcon"></span>
        <span id="messageText"></span>
    </div>

    <!-- Header & Toolbar -->
    <div class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold">✎</div>
                <h1 class="text-xl font-bold text-slate-800">วาดแล้วสร้าง GIF</h1>
            </div>

            <!-- Tools -->
            <div class="flex flex-wrap items-center gap-4 sm:gap-6 bg-slate-50 p-2 rounded-2xl border border-slate-100">
                <!-- Color -->
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-slate-600">สี:</span>
                    <div class="color-picker-wrapper shadow-sm">
                        <input type="color" id="colorPicker" value="#0f172a">
                    </div>
                </div>

                <div class="w-px h-6 bg-slate-300"></div>

                <!-- Size -->
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-slate-600">ขนาด:</span>
                    <input type="range" id="sizePicker" min="1" max="30" value="5" class="w-24 sm:w-32 accent-blue-600">
                    <span id="sizeValue" class="text-xs font-mono text-slate-500 w-4">5</span>
                </div>

                <div class="w-px h-6 bg-slate-300"></div>

                <!-- Actions -->
                <button id="clearBtn" class="text-sm font-semibold text-slate-600 hover:text-red-600 transition-colors px-2 py-1 rounded-lg hover:bg-red-50">
                    ล้างกระดาน
                </button>
                <button id="generateBtn" class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl shadow transition-all active:scale-[0.97] flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2H4zm10.293 6.707a1 1 0 00-1.414-1.414L9 11.586 7.121 9.707a1 1 0 00-1.414 1.414l2.586 2.586a1 1 0 001.414 0l4.586-4.586z" clip-rule="evenodd" />
                    </svg>
                    <span id="generateText">บันทึกเป็น GIF</span>
                    <div id="loadingSpinner" class="spinner hidden w-4 h-4 border-2"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Canvas Area -->
    <div class="flex-1 flex flex-col items-center justify-center p-4 sm:p-8 relative">
        <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 relative aspect-video flex justify-center items-center">
            
            <!-- Canvas Resolution (Internal: 800x450), CSS Scales it -->
            <canvas id="drawingCanvas" width="800" height="450" class="w-full h-full object-contain bg-white block"></canvas>

            <!-- Loading Overlay during GIF generation -->
            <div id="renderOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm hidden flex-col items-center justify-center gap-4 z-20">
                <div class="spinner border-blue-600 border-t-transparent w-10 h-10 border-4"></div>
                <div class="text-center">
                    <div class="text-lg font-bold text-blue-900 mb-1">กำลังประมวลผลวิดีโอ GIF</div>
                    <div class="text-sm font-medium text-blue-600" id="renderProgress">ประมวลผล 0%</div>
                </div>
            </div>
        </div>
        <p class="text-slate-400 text-sm mt-4 text-center">ใช้เมาส์ ปากกา หรือนิ้ว วาดลงบนกระดานสีขาวด้านบนได้เลย</p>
    </div>

    <script>
        // --- 1. UI Setup & Notification ---
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const messageIcon = document.getElementById('messageIcon');

        function showMessage(msg, type = 'success') {
            messageText.textContent = msg;
            messageBox.className = 'fixed top-4 right-4 p-4 rounded-xl shadow-lg transition-all duration-300 z-50 transform flex items-center gap-3 font-medium';
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-500', 'text-white');
                messageIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            } else {
                messageBox.classList.add('bg-emerald-500', 'text-white');
                messageIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
            }

            messageBox.classList.remove('hidden');
            requestAnimationFrame(() => {
                messageBox.classList.remove('opacity-0', 'translate-y-[-20px]');
                messageBox.classList.add('opacity-100', 'translate-y-0');
            });

            setTimeout(() => {
                messageBox.classList.remove('opacity-100', 'translate-y-0');
                messageBox.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => messageBox.classList.add('hidden'), 300);
            }, 3000);
        }

        // --- 2. Load gif.js Worker ---
        let workerBlobURL = null;
        async function initGifWorker() {
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
                if (!response.ok) throw new Error('Network response was not ok');
                const blob = await response.blob();
                workerBlobURL = URL.createObjectURL(blob);
            } catch (error) {
                console.error('Failed to load gif worker:', error);
                showMessage('โหลดระบบสร้าง GIF ไม่สำเร็จ', 'error');
            }
        }
        initGifWorker();

        // --- 3. Canvas & Drawing Setup ---
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizePicker = document.getElementById('sizePicker');
        const sizeValue = document.getElementById('sizeValue');
        const clearBtn = document.getElementById('clearBtn');

        // Update size display
        sizePicker.addEventListener('input', (e) => {
            sizeValue.textContent = e.target.value;
        });

        // Initialize Canvas Background
        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        clearCanvas();

        // State for drawing & recording
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // เราจะเก็บลายเส้นทั้งหมดที่วาด เพื่อนำไปรันใหม่ตอนสร้าง GIF
        // รูปแบบข้อมูล: { color, size, points: [{x, y}, {x, y}, ...] }
        let strokes = []; 
        let currentStroke = null;

        // ฟังก์ชันช่วยคำนวณตำแหน่งเมาส์/นิ้ว ให้ตรงกับพิกัดจริงบน Canvas
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // รองรับทั้งเมาส์และการสัมผัส
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            // คำนวณ Scale เนื่องจาก CSS อาจปรับขนาด Canvas ให้เล็กลง
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;

            // เริ่มบันทึกเส้นใหม่
            currentStroke = {
                color: colorPicker.value,
                size: parseInt(sizePicker.value),
                points: [{ x: lastX, y: lastY }]
            };
            strokes.push(currentStroke);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPos(e);
            
            // วาดเส้นลงบน Canvas จริง
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = colorPicker.value;
            ctx.lineWidth = parseInt(sizePicker.value);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // บันทึกตำแหน่ง
            currentStroke.points.push({ x: pos.x, y: pos.y });

            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            isDrawing = false;
        }

        // Pointer Events (Mouse + Touch + Pen)
        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);
        canvas.addEventListener('pointerout', stopDrawing);
        
        // Touch events fallback prevent default scrolling
        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // Clear button
        clearBtn.addEventListener('click', () => {
            clearCanvas();
            strokes = []; // ลบประวัติการวาด
        });


        // --- 4. GIF Generation (Replaying Strokes) ---
        const generateBtn = document.getElementById('generateBtn');
        const generateText = document.getElementById('generateText');
        const spinner = document.getElementById('loadingSpinner');
        const renderOverlay = document.getElementById('renderOverlay');
        const renderProgress = document.getElementById('renderProgress');

        generateBtn.addEventListener('click', () => {
            if (strokes.length === 0) {
                showMessage('กรุณาวาดลายเส้นก่อนสร้าง GIF', 'error');
                return;
            }
            if (!workerBlobURL) {
                showMessage('ระบบยังโหลดไม่เสร็จสมบูรณ์ กรุณารอสักครู่', 'error');
                return;
            }

            // UI State
            generateBtn.disabled = true;
            generateText.textContent = 'กำลังสร้าง...';
            spinner.classList.remove('hidden');
            renderOverlay.classList.replace('hidden', 'flex');
            renderProgress.textContent = 'กำลังวาดเฟรม (0%)...';

            // สร้าง Canvas เสมือน (Off-screen) เพื่อใช้วาดรีเพลย์ทีละสเต็ป
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            // พื้นหลังขาว
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            const gif = new GIF({
                workers: 2,
                quality: 10, // 1-30, ยิ่งน้อยยิ่งคุณภาพดีแต่ประมวลผลนาน
                width: canvas.width,
                height: canvas.height,
                workerScript: workerBlobURL,
                transparent: null
            });

            // บันทึกเฟรมเริ่มต้น (หน้าเปล่า)
            gif.addFrame(tempCanvas, { delay: 500, copy: true });

            // ตั้งค่าความเร็ว (จับภาพทุกๆ กี่จุดที่วาด)
            // ยิ่งค่าน้อย GIF จะสมูทแต่ไฟล์จะใหญ่และช้า ยิ่งค่ามาก GIF จะเร็วและกระตุกนิดๆ
            const framesToSkip = 3; 
            let pointCounter = 0;

            // เริ่มรีเพลย์ลายเส้นทั้งหมด
            for (const stroke of strokes) {
                if (stroke.points.length < 2) continue;

                tCtx.strokeStyle = stroke.color;
                tCtx.lineWidth = stroke.size;
                tCtx.lineCap = 'round';
                tCtx.lineJoin = 'round';

                for (let i = 1; i < stroke.points.length; i++) {
                    tCtx.beginPath();
                    tCtx.moveTo(stroke.points[i - 1].x, stroke.points[i - 1].y);
                    tCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                    tCtx.stroke();

                    pointCounter++;
                    // เพิ่มเฟรมลงใน GIF ตามจังหวะ
                    if (pointCounter % framesToSkip === 0) {
                        gif.addFrame(tempCanvas, { delay: 40, copy: true });
                    }
                }
                // จบแต่ละเส้น ให้บันทึกเฟรมเสมอ
                gif.addFrame(tempCanvas, { delay: 50, copy: true });
            }

            // บันทึกเฟรมสุดท้าย ค้างไว้ 2 วินาทีเพื่อให้ดูผลลัพธ์จบก่อนวนลูป
            gif.addFrame(tempCanvas, { delay: 2000, copy: true });

            // Event เมื่อประมวลผล
            gif.on('progress', p => {
                renderProgress.textContent = `ประมวลผลวิดีโอ ${Math.round(p * 100)}%`;
            });

            gif.on('finished', function(blob) {
                // สร้างลิงก์ดาวน์โหลด
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `drawing-${Date.now()}.gif`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                setTimeout(() => URL.revokeObjectURL(url), 10000);

                // คืนค่า UI
                generateBtn.disabled = false;
                generateText.textContent = 'บันทึกเป็น GIF';
                spinner.classList.add('hidden');
                renderOverlay.classList.replace('flex', 'hidden');
                
                showMessage('สร้างไฟล์ GIF เรียบร้อยแล้ว!');
            });

            // เริ่มรัน (Render)
            gif.render();
        });

    </script>
</body>
</html>
